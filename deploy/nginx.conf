server {
    listen 80;
    server_name your-domain.com;  # 改成你的域名或服务器公网 IP

    # 最大上传 1GB，根据你的视频大小调整
    client_max_body_size 1G;

    # 日志
    access_log /var/log/nginx/music-game-helper.access.log;
    error_log /var/log/nginx/music-game-helper.error.log;

    # 前端静态页面（cupnb.html 等）
    location / {
        root /opt/music-game-video-helper/frontend;
        index cupnb.html;
        try_files $uri $uri/ =404;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # 后端结果文件下载/播放
    location /results/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
